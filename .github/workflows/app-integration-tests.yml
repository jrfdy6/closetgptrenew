name: App integration contracts
on:
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/app-integration-tests.yml']
  push:
    paths: ['backend/**', 'frontend/**', '.github/workflows/app-integration-tests.yml']
permissions:
  contents: read
jobs:
  backend-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install contract-test dependencies without provider credentials
        run: pip install firebase-admin==6.2.0 fastapi==0.104.1 httpx==0.25.2 pydantic==2.5.0 Pillow==10.0.1 requests==2.32.5 python-dotenv==1.0.0 Unidecode==1.3.7 python-multipart==0.0.6
      - name: Verify onboarding, ownership, wear, privacy and route contracts
        env:
          PYTHONPATH: '.:tests'
        run: >-
          python -m unittest
          test_outfit_wear test_wear_reward_integration test_wear_statistics
          test_gamification_catalog test_gamification_automation test_feedback_reward_recovery test_badge_eligibility
          test_tve_epoch_hooks test_derived_epoch_hooks test_wardrobe_verified_api
          test_onboarding_state test_quiz_profile test_user_profile
          test_outfit_creation_admission test_outfit_persistence test_saved_outfit
          test_generation_admission test_recommendation_fidelity_endpoint
          test_saved_outfit_item_ownership test_auth_compat_privacy test_read_endpoint_concurrency
          test_app_data_privacy test_privacy_routes test_privacy_lifecycle_fences
          test_wardrobe_create_contract test_wardrobe_mutations test_root_integration_review
          test_badge_response test_forgotten_gems_recency test_null_recency test_firestore_index_manifest
          test_route_registry test_privileged_route_registration -q
  frontend-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Typecheck application, Jest and Cypress sources
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Run complete frontend unit suite
        run: npm test -- --runInBand
      - name: Build with production behavior and public-only configuration
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          ENABLE_INTERNAL_DEBUG_PAGES: 'false'
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: 'false'
          NEXT_PUBLIC_API_URL: https://closetgptrenew-production.up.railway.app
          NEXT_PUBLIC_BACKEND_URL: https://closetgptrenew-production.up.railway.app
          NEXT_PUBLIC_API_BASE_URL: https://closetgptrenew-production.up.railway.app/api
          # Non-live Firebase client fixtures let prerendering initialize the SDK.
          # CI receives no Admin credentials or authenticated provider access.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-public-build-fixture
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-easyoutfit-ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-easyoutfit-ci
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-easyoutfit-ci.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:123456789:web:ci-public-build'
        run: npm run build
